<script>

/* ---------- state ---------- */
// topic = 위쪽 탭, sub = 주제 안의 하위 탭. 주소는 #topic 또는 #topic/sub.
const S = { veN: 4, peN: 1, lcrEv: false, topic: 'overview', sub: {}, layGhost: true, layPipes: true, layLabels: true };
// 예전 탭 주소(ev.html 등에서 링크)를 새 구조로 옮긴다
const ALIAS = { void: 'resource/void', crushed: 'resource/crushed', persulfate: 'resource/persulfate', layout: 'resource/chunk', c2f4: 'ptfe/lcr' };

/* ---------- constants (Theta 2에서 재확인한 값) ---------- */
// Void Extractor: void_excavation/mining — LV 30 EU/t · 640t. MV 해치 = 1단계 OC → 120 EU/t · 320t.
const CYC = 320;
const CPH1 = 72000 / CYC;                             // VE 1대의 시간당 사이클
const cph = () => CPH1 * S.veN;                       // 전체 시간당 사이클
const VE_EUT = 120;
const PER_CYCLE = {
  mvCrushed: 2.8, hvCrushed: 4.2, molten: 175, silver: 1.6, calcite: 3.2, sludgeDust: 3.2,
  drilling: 5000, water: 4980, lubricant: 20, distilled: 280, persulfate: 420,
};
const ORES = [
  { n: 'Lepidolite', t: 'MV', c: 0.7, from: 'D', by: ['Lithium', 'Lithium', 'Caesium'], use: 'Lithium, Fluorine 원료' },
  { n: 'Pyrochlore', t: 'MV', c: 0.7, from: 'D', by: ['Apatite', 'Apatite', 'Calcium'], use: 'Niobium, Fluorine 원료' },
  { n: 'Pyrolusite', t: 'MV', c: 0.7, from: 'D', by: ['Manganese', 'Manganese', 'Tantalite'], use: 'Manganese' },
  { n: 'Magnesite', t: 'MV', c: 0.7, from: 'D', by: ['Magnesium', 'Magnesium', 'Cobaltite'], use: 'Magnesium (Titanium 환원제)' },
  { n: 'Beryllium', t: 'HV', c: 0.525, from: 'E', by: ['Emerald', 'Emerald', 'Beryllium'], use: 'Beryllium' },
  { n: 'Zavaritskite', t: 'HV', c: 0.525, from: 'E', by: ['Topaz', 'Blue Topaz', 'Bismuth'], use: 'Bismuth, Topaz류는 Fluorine 원료' },
  { n: 'Barite', t: 'HV', c: 0.42, from: 'F', by: ['Pyrite', 'Pyrite', 'Chalcopyrite'], use: 'Barium' },
  { n: 'Chalcopyrite', t: 'HV', c: 0.42, from: 'F', by: ['Gold', 'Pyrite', 'Cobalt'], use: 'Copper, Gold' },
  { n: 'Bornite', t: 'HV', c: 0.42, from: 'F', by: ['Gold', 'Cadmium', 'Cobalt'], use: 'Copper, Cadmium' },
  { n: 'Tantalite', t: 'HV', c: 0.63, from: 'G', by: ['Manganese', 'Niobium', 'Niobium'], use: 'Tantalum, Niobium' },
  { n: 'Pollucite', t: 'HV', c: 0.63, from: 'G', by: ['Caesium', 'Aluminium', 'Aluminium'], use: 'Caesium' },
  { n: 'Cassiterite', t: 'HV', c: 0.63, from: 'G', by: ['Tin', 'Tin', 'Bismuth'], use: 'Tin' },
];
// Fluorine per VE cycle: Ore Factory 기대 산출 1.5 dust/crushed, 부산물 확률 25% / 12.5%
const FLUORINE = [
  { n: 'Lepidolite', v: 0.7 * 1.5 / 20 * 2000, how: '1.05 dust ÷ 20 × 2000mB' },
  { n: 'Pyrochlore', v: 0.7 * 1.5 / 11 * 1000, how: '1.05 dust ÷ 11 × 1000mB' },
  { n: 'Topaz · Blue Topaz', v: 0.525 * 0.25 / 10 * 1000 + 0.525 * 0.125 / 13 * 2000, how: 'Zavaritskite 부산물 (25% / 12.5%)' },
];
const F_PER_CYCLE = FLUORINE.reduce((a, b) => a + b.v, 0);

/* 처리 단계: 청크에 두는 기계 기준 (runs = VE 사이클당 실행 횟수, dur/eut = 그 기계에서).
   A는 LV 레시피지만 전선을 MV · HV 두 계통으로 줄이려고 MV 기계에 둔다 (1단계 OC → 60t · 120 EU/t). */
const STAGES = [
  { id: 'A', m: 'Electrolyzer', t: 'MV', runs: 0.4, dur: 60, eut: 120, r: 'rare_ore_residue', what: 'Rare Ore Residue', note: 'LV 레시피 · MV 기계에서 60t' },
  { id: 'B', m: 'Centrifuge', t: 'MV', runs: 1.6, dur: 50, eut: 64, r: '*_sludge ×4', what: 'Sludge ×4' },
  { id: 'C', m: 'Electrolyzer', t: 'MV', runs: 1.6, dur: 50, eut: 120, r: 'rare_metallic_residue', what: 'Rare Metallic Residue' },
  { id: 'D', m: 'Centrifuge', t: 'MV', runs: 0.7, dur: 240, eut: 120, r: 'raw_ore_slurry', what: 'Raw Ore Slurry' },
  { id: 'E', m: 'Electrolyzer', t: 'HV', runs: 0.525, dur: 240, eut: 480, r: 'mixed_mineral_residue', what: 'Mixed Mineral Residue' },
  { id: 'F', m: 'Centrifuge', t: 'HV', runs: 0.42, dur: 230, eut: 480, r: 'sulfuric_mineral_mixture', what: 'Sulfuric Mineral Mixture' },
  { id: 'G', m: 'Centrifuge', t: 'HV', runs: 0.63, dur: 230, eut: 480, r: 'oxygenous_mineral_mixture', what: 'Oxygenous Mineral Mixture' },
];
STAGES.forEach(s => { s.busy = s.runs * s.dur; s.eu = s.busy * s.eut; });
const stage = id => STAGES.find(s => s.id === id);
const LIMIT = 0.95;                                   // 가동률 95%를 넘으면 한 대 더
const need = (busy, n) => Math.max(1, Math.ceil(busy * n / (CYC * LIMIT) - 1e-9));
const MIXER_BUSY = 64;                                // drilling_fluid (Water) 64t — VE 쪽 청크
// clusters.js: chancedOutput(개수, 기본 확률, 티어당 부스트). MV 해치 = OC 1단계
const RAW_ORES = [
  { n: 'Raw Coal', q: 2, base: 40, boost: 10 }, { n: 'Raw Gold', q: 2, base: 40, boost: 7.5 },
  { n: 'Raw Sodalite', q: 1, base: 30, boost: 10 }, { n: 'Raw Pentlandite', q: 3, base: 30, boost: 5 },
  { n: 'Raw Realgar', q: 1, base: 60, boost: 12 }, { n: 'Raw Silver', q: 2, base: 35, boost: 7.5 },
];
const rawOrePerCycle = tiers => RAW_ORES.reduce((a, o) => a + o.q * Math.min(100, o.base + o.boost * tiers) / 100, 0);

/* 청크 전력: mv_16a_energy_converter 4대 = MV 64A (8,192 EU/t).
   C1~C3 → hv_transformer_16a(승압) → HV 12A, C4 → MV 16A. 단일 블록은 돌 때 자기 전압 1A. */
const POWER = { hvA: 12, mvA: 16, totalA: 64 };
const machinesAt = (n, tier) => STAGES.filter(s => s.t === tier).reduce((a, s) => a + need(s.busy, n), 0);
const chainEU = STAGES.reduce((a, s) => a + s.eu, 0);            // VE 1사이클당
const chainEUt = n => chainEU * n / CYC;
// Distillation Tower: molten_ore_mixture — 10,000mB · 1200t · 1920 EU/t (EV). HV 에너지 해치(2A) 2개 = 4A → EV 1A로 인식
const TOWER = { in: 10000, dur: 1200, eut: 1920, hvA: 4 };
const towerRuns = n => PER_CYCLE.molten * CPH1 * n / TOWER.in;   // 시간당 증류 횟수

/* Titanium: Molten Ore Mixture 10,000mB → Molten Ilmenite 1000 · Molten Bauxite 1500 (+5종)
   Autoclave(HV): Molten X 500 + Stone Dust → Raw X. 이후는 가정: Raw 1 → Crushed 1, Ore Factory(EV 티어) 기대 1.5 dust + 4차 Rutile 7.5% */
const TI = {
  ilmRaw: 1000 / 500, bauRaw: 1500 / 500, dustPer: 1.5, quat: 0.075,
};
TI.ilmDust = TI.ilmRaw * TI.dustPer; TI.bauDust = TI.bauRaw * TI.dustPer;
TI.rutIlm = TI.ilmDust * 2 / 10 + TI.ilmRaw * TI.quat;          // rutile_from_ilmenite_fix: 10 Ilmenite + 2 Carbon → 2 Rutile
TI.rutBau = TI.bauDust / 15 + TI.bauRaw * TI.quat;              // bauxite_electrolysis: 15 Bauxite → 6 Aluminium + 1 Rutile
TI.per10k = TI.rutIlm + TI.rutBau;                              // Rutile 1 → TiCl4 1000 → Titanium 1
TI.al10k = TI.bauDust / 15 * 6;
const tiPerHour = n => towerRuns(n) * TI.per10k;

/* PTFE: 첫 LCR에 들어가는 양 (GT 재료량: plate 1 · large pipe 6 · normal pipe 3 · frame 2 ingot). 해치 8개 가정 */
const LCR_PTFE = [
  { n: 'PTFE Large Fluid Pipe ×2', s: '컨트롤러 (CRC / PMP / CHC)', mb: 2 * 6 * 144 },
  { n: 'PTFE Pipe Casing ×1', s: 'plate 4 + frame 1 + normal pipe 4', mb: (4 + 2 + 4 * 3) * 144 },
  { n: 'Chemically Inert Casing ×16', s: 'casing_ptfe_inert: PTFE 216 + Solid Steel Casing', mb: 16 * 216 },
];
const LCR_PTFE_MB = LCR_PTFE.reduce((a, b) => a + b.mb, 0);

/* ---------- topics ---------- */
TIER.EV = { c: 'var(--s5)', name: 'EV 레시피 (HV 해치 2개)' };
TIER.GOAL = { c: 'var(--good)', name: '목표' };
TIER.OK = { c: 'var(--s3)', name: '이미 있음' };
TIER.CR = { c: 'var(--s6)', name: '클린룸 안 레시피' };
TIER.GATE = { c: 'var(--critical)', name: '게이트' };
const TOPICS = [
  { id: 'overview', name: '개요' },
  { id: 'gate', name: '0 · 게이트 순서도' },
  { id: 'power', name: '1 · 전력' },
  { id: 'resource', name: '2 · 자원', subs: [['void', 'Void 체인'], ['chunk', '한 청크 배치 · 3D'], ['crushed', 'Crushed Ore'], ['persulfate', 'Sodium Persulfate']] },
  { id: 'ptfe', name: '3 · PTFE → LCR', subs: [['boot', '첫 LCR 만들기'], ['lcr', 'LCR 이후 C2F4 양산']] },
  { id: 'passive', name: '패시브 (LCR 후)', subs: [['flow', '수지 · 대수'], ['3d', '화학 청크 · 3D']] },
  { id: 'prep', name: '패시브 (EV 준비)', subs: [['metal', '금속 · 초전도'], ['chem', '피복 화학'], ['3d', '청크 · 3D']] },
  { id: 'circuit', name: '4 · 클린룸 · 회로' },
  { id: 'next', name: '5 · 다음 티어' },
  { id: 'misc', name: '6 · 기타', subs: [['multi', '멀티블럭'], ['epoxy', '에폭시']] },
];
const src = (s) => `<span class="src">${s}</span>`;

/* ---------- 개요 ---------- */
function viewOverview() {
  const n = S.veN;
  const avgA = chainEUt(n) / 128;
  return `

  순서는 <a href="#gate">0 · 게이트 순서도</a>를 따릅니다: <b>클린룸 → Workstation · LPIC → Vacuum Freezer · HV 해치 2개 → Nichrome 코일 · 첫 Titanium</b>. 멀티블럭은 지금도 MV 해치 2개로 HV 전압이라, PTFE → LCR과 패시브 화학은 게이트와 상관없는 곁가지입니다.</p>
  ${callout('ok', '✓', `<b>Theta 2에서 레시피를 다시 가져왔습니다.</b> 이 페이지가 쓰는 레시피는 바뀐 것이 없습니다. KubeJS는 파일 구조가 통째로 바뀌었지만(<code>default/</code> · <code>hardmode/</code> 분리 폐지) Void 체인 · Ore Factory · Chemical Plant 레시피를 ID별로 비교하면 같고, GTCEu jar(1.7.0b → 1.7.1b)는 화학 · 회로 레시피 클래스와 재료 정의가 그대로입니다.`)}
  <div class="tiles">
    ${tile('Void Extractor', n, '대 · MV', `사이클 ${CYC}t · 시간당 ${fmt(cph(), 0)}사이클`)}

    ${tile('첫 LCR에 필요한 PTFE', fmt(LCR_PTFE_MB / 144, 0), 'ingot', `${fmt(LCR_PTFE_MB, 0)}mB · 단일 CR로 만듦`)}

        { id: 've', x: 20, y: 170, w: 170, t: `Void Extractor ×${n}`, s: 'MV 해치 · VE 청크', k: 'LV', tip: 'Residue와 Slurry만 처리 청크로 보냄' },
        { id: 'ch', x: 250, y: 170, w: 170, t: '2 처리 청크', s: 'A~G · MV 64A', k: 'HV', tip: '16×16 청크 하나. HV 기계는 트랜스포머로 승압' },
        { id: 'pt', x: 480, y: 60, w: 170, t: '3 PTFE → LCR', s: `단일 CR · PTFE ${fmt(LCR_PTFE_MB / 144, 0)} ingot`, k: 'LCR', tip: 'HF · Chloroform · C2F4(HV CR) · PTFE를 단일 블록으로 → LCR 1대' },
        { id: 'cr', x: 480, y: 280, w: 170, t: '4 클린룸', s: 'EV 회로 · LPIC → HV 해치', k: 'HV', tip: 'EV 회로(Workstation, 120 EU/t)와 IV 회로(Mainframe, 480 EU/t), 그리고 HV 에너지 해치의 LPIC(cut_lpic · 클린룸)' },
        { id: 'ds', x: 720, y: 170, w: 170, t: '5 Distillation Tower', s: 'HV 해치 2개 → EV', k: 'EV', tip: '컨트롤러에 EV 회로 4개. HV 2A 해치 2개 = 4A → EV 레시피' },

        { a: 've', b: 'ch', l: 'Residue · Slurry', amt: 1000 },

        { a: 'ch', b: 'cr', l: 'crushed → dust', lt: 0.5, ly: 16 },
        { a: 'pt', b: 'ds', l: 'LCR (MV 해치 2개) → 패시브', lt: 0.55, ly: -12 },
        { a: 'cr', b: 'ds', l: 'EV 회로 · HV 해치', lt: 0.5, ly: 14 },

      <p class="sub">Theta 2 인스턴스 세이브를 읽기 전용으로 스캔했습니다.</p>

          <tr><td>Cleanroom · HV Circuit Assembler</td><td class="n">0</td><td>4 Workstation · Mainframe</td></tr>

    </div>
    <div class="card">
      <h3>이미 있는 것</h3>
      <p class="sub">새로 짓지 않고 재배정합니다.</p>

        { label: 'Electric Blast Furnace', sub: 'Kanthal 코일 · MV 해치 2개 = HV 2,800K', value: 28, color: 'var(--s8)', text: '28대' },

    <ul class="pts">
      <li>Lepidolite · Pyrochlore · Topaz · Blue Topaz · MgCl2 · HCl의 분해 레시피가 있는지와 소요 시간 (Fluorine · 염소 · 마그네슘 순환의 전제)</li>
      <li>Raw 광석 1개를 Macerator에 넣으면 Crushed가 몇 개인지 (Titanium 예상치는 1개로 계산 — 2개면 두 배)</li>
      <li>Electric Ore Factory의 병렬 수, LCR · Cleanroom 구조(케이싱 최소 개수, 크기 범위)는 게임 안 미리보기로</li>

/* ---------- 0 게이트 순서도 ----------

const firstN = (busy, j) => { for (let n = 1; n <= 8; n++) if (need(busy, n) > j) return n; return 99; };

function buildChunk(N) {
  const boxes = [], pipes = [];
  const box = o => (boxes.push(o), o);
  const unit = (x, y, z, o) => box({ x, y, z, w: 1, h: 1, d: 1, ...o });
  const cable = (type, pts) => pipes.push({ type, pts: pts.map(([x, y, z]) => [x + 0.5, y + 0.5, z + 0.5]) });
  const node = (x, y, z, ghost, what, cards) => box({ x: x + 0.15, y: y + 0.15, z: z + 0.15, w: 0.7, h: 0.7, d: 0.7, col: '--s8', ghost, node: true, tip: `LaserIO Node · ${what}|${cards.join(' · ')}` });
  const plate = (x, y, z, face, what) => {
    const t = 0.14, o = { x: x + 0.2, y: y + 0.2, z: z + 0.2, w: 0.6, h: 0.6, d: 0.6, col: '--s7', tip: `AE2 Storage Bus|${what} — ME 터미널에서 잔량이 보임` };
    if (face === 'w') Object.assign(o, { x: x - t, w: t }); if (face === 'n') Object.assign(o, { z: z - t, d: t }); if (face === 's') Object.assign(o, { z: z + 1, d: t });
    box(o);
  };
  // 청크 경계 (항상 보임)
  box({ x: 0, y: -0.02, z: 0, w: 16, h: 0.02, d: 16, ghost: true, outline: true, tip: '청크 경계 16 × 16' });
  // 단계 탱크 (x = 1) + 노드 + storage bus
  [['T-Res', 'Rare Ore Residue', 1, 'f0 IN (VE 청크에서)', 'f1 OUT → A'], ['T-Slu', 'Raw Ore Slurry', 4, 'f0\' IN (VE) · f2 IN (A)', 'f3 OUT → D'],
   ['T-MMR', 'Mixed Mineral Residue', 7, 'f4 IN', 'f5 OUT → E'], ['T-Sul', 'Sulfuric Mineral Mixture', 10, 'f6 IN', 'f8 OUT → F'], ['T-Oxy', 'Oxygenous Mineral Mixture', 13, 'f7 IN', 'f10 OUT → G']]
    .forEach(([lab, n, z, fin, fout]) => {
      unit(1, 0, z, { col: '--muted', label: lab, tip: `LV Super Tank · ${n}|단계 버퍼. 잔량으로 병목을 찾음` });
      node(1, 1, z, false, lab, [`↓ ${fin}`, `${fout} (round robin)`]);
      plate(1, 0, z, 'w', lab);
    });
  // 기계 열
  const colsOf = {};
  const row = (id, x0) => {
    const s = stage(id), slots = need(s.busy, 4), live = need(s.busy, N), z = ROWS[id], cols = Math.ceil(slots / 2);
    for (let c = 0; c < cols; c++) {
      [0, 1].forEach(k => {
        const j = c * 2 + k; if (j >= slots) return;
        unit(x0 + c, k * 2, z, { col: TIER[s.t].c.slice(4, -1), ghost: j >= live, label: `${id}${j + 1}`,
          tip: `${id}${j + 1} · ${s.t} ${s.m}|${s.r}${s.note ? ' · ' + s.note : ''}${j >= live ? ` · VE ${firstN(s.busy, j)}대부터` : ''}` });
      });
      node(x0 + c, 1, z, c * 2 >= live, `${id} 열 ${c + 1}`, [`↓↑ ${id}${c * 2 + 1}${c * 2 + 1 < slots ? `/${id}${c * 2 + 2}` : ''}`, ...CARDS[id]]);
    }
    colsOf[id] = cols; return cols;
  };
  const a = row('A', 2), b = row('B', 2 + a), c = row('C', 2 + a + b);
  row('D', 2); row('E', 2); row('F', 2); row('G', 2);
  const abcEnd = 2 + a + b + c;

  // 입구: VE 청크에서 오는 레이저 (서쪽 경계)
  unit(0, 2, 2, { col: '--s4', label: '입구', tip: 'Laser Connector · VE 청크에서|Residue · Slurry 두 채널. 8칸마다 Connector로 중계' });
  cable('in', [[-6, 2, 2], [0, 2, 2]]);

  // 출구
  unit(7, 0, 1, { col: '--s4', label: 'Dust', tip: 'Functional Storage · dust|Chromite · Rare Earth · Vanadium Magnetite · Cobaltite · Calcite · Silver' });
  node(7, 1, 1, false, 'dust 창고', ['↓ 아이템 IN i3']); plate(7, 0, 1, 'n', 'dust 창고');
  unit(7, 0, 4, { col: '--s4', label: '→OF-A', tip: 'MV crushed 출구|→ ME → Ore Factory A (Distilled Water)' });
  node(7, 1, 4, false, 'MV crushed', ['↓ 아이템 IN i4']);
  unit(7, 0, 10, { col: '--s4', label: '→OF-B', tip: 'HV crushed 출구|→ ME → Ore Factory B (Sodium Persulfate)' });
  node(7, 1, 10, false, 'HV crushed', ['↓ 아이템 IN i5']);

  // Molten Ore Mixture 탱크 + Distillation Tower 자리 (HV 해치 2개)
  unit(10, 0, 4, { col: '--s5', label: 'Molten', tip: 'Super Tank · Molten Ore Mixture|D에서 f9. 증류탑 입력' });
  node(10, 1, 4, false, 'Molten', ['↓ 유체 IN f9', '→ 증류탑 입력 해치 f11']); plate(10, 0, 4, 'n', 'Molten Ore Mixture');
  box({ x: 11, y: 0, z: 3, w: 3, h: 8, d: 3, ghost: true, label: 'Distillation Tower', tip: 'Distillation Tower · 3×3 · 8층|HV 에너지 해치(2A) 2개 → EV 레시피. 출력 7종 = 층마다 출력 해치 1개. 5 탭' });
  unit(10, 0, 5, { col: '--s2', ghost: true, tip: 'HV Energy Hatch ×2 (증류탑 서쪽 면)|HV 간선에서 4A' });

  // 변전: 컨버터 4대. C1~C3 → hv_transformer_16a(승압), C4 → MV
  const conv = (x, z, n2, what) => unit(x, 0, z, { col: '--s1', label: n2, tip: `mv_16a_energy_converter · ${n2}|FE → EU, MV 16A. ${what}` });
  unit(12, 0, 9, { col: '--s2', label: 'HV 16A', tip: 'hv_transformer_16a (승압)|MV 48A 입력 → HV 12A 출력. 서쪽 면이 간선' });
  conv(13, 9, 'C1', '트랜스포머에 직결'); conv(12, 8, 'C2', '트랜스포머에 직결'); conv(12, 10, 'C3', '트랜스포머에 직결');
  conv(9, 1, 'C4', 'MV 기계 전용. 출력면은 서쪽');
  node(13, 1, 9, false, '변전 (전력 네트워크)', ['↓ C1 에너지 IN', '레이저 → C2 · C3']);
  node(9, 1, 1, false, 'C4 (전력 네트워크)', ['↓ 에너지 IN']);

  // HV: 트랜스포머 → 간선 x = 9 → E · F · G 행 남쪽 면(두 층) + 증류탑
  cable('hv', [[11, 0, 9], [9, 0, 9]]);
  cable('hv', [[9, 0, 5], [9, 0, 14]]);
  cable('hv', [[9, 0, 5], [10, 0, 5]]);
  [['E', 8], ['F', 11], ['G', 14]].forEach(([id, z]) => {
    const xr = 2 + colsOf[id];
    cable('hv', [[9, 0, z], [2, 0, z]]); cable('hv', [[xr, 0, z], [xr, 2, z], [2, 2, z]]);
  });
  // MV: C4 → A~C 행 남쪽(z 2), D 행 남쪽(z 5)
  cable('mv', [[8, 0, 2], [2, 0, 2]]); cable('mv', [[abcEnd, 0, 2], [abcEnd, 2, 2], [2, 2, 2]]);
  cable('mv', [[8, 0, 2], [8, 0, 5], [2, 0, 5]]); cable('mv', [[2 + colsOf.D, 0, 5], [2 + colsOf.D, 2, 5], [2, 2, 5]]);
  // ME: 탱크 서쪽 storage bus → 북쪽 경계를 따라 출구 창고
  cable('me', [[0, 0, 13], [0, 0, 0], [7, 0, 0]]); cable('me', [[7, 0, 0], [10, 0, 0], [10, 0, 3]]);

  // 레이저: 같은 네트워크 노드끼리 최소 신장 트리 (8칸 넘으면 점선 = Connector 필요)
  const lz = boxes.filter(q => q.node && !q.ghost && !/전력/.test(q.tip));
  const cen = q => [q.x + q.w / 2, q.y + q.h / 2, q.z + q.d / 2];
  const inT = new Set([0]);
  while (lz.length && inT.size < lz.length) {
    let best = null;
    inT.forEach(i => lz.forEach((q, j) => { if (inT.has(j)) return; const d = Math.hypot(...cen(lz[i]).map((v, k) => v - cen(q)[k])); if (!best || d < best.d) best = { i, j, d }; }));
    inT.add(best.j);
    pipes.push({ type: 'beam', pts: [cen(lz[best.i]), cen(lz[best.j])], long: best.d > 8 });
  }
  return { boxes, pipes };
}

/* ---------- 패시브 · EV 준비 (금속 · 초전도 · 케이블 피복) ----------

   blast: Aluminium 1700K · VA[MV] (duration = 질량 × 온도 ÷ 50 ≈ 918t), Lumium 1700K · VA[HV] 1000t (Silver 1 · Tin 3 · Glowstone 2),
   Nichrome 2700K · VA[EV] 1300t (HV 해치 2개 · 게이트 2) → Hot → Vacuum Freezer(게이트 3). 1750K 이하는 Hot ingot이 아님.
   EV 케이블 피복 (WireRecipeHandler): Rubber 144 · Silicone Rubber 72 · SBR 36 + PVC foil 1.
   polyvinyl_chloride_from_oxygen LCR 160t: Vinyl Chloride 144 + O₂ 1000 → PVC 216 (CR은 Air로 144).
   vinyl_chloride_from_chlorine CR LV 160t: Ethylene 1000 + Cl 2000 → VC 1000 + HCl 1000. */
const EVP_H = { al: 32, lum: 16, nic: 16, cable: 32 };
function evPrep() {
  const H = EVP_H, pvc = H.cable / 4 * 144, vc = pvc / 216 * 144, sir = H.cable * 72;
  const rows = [
    ['EK', 'EBF · Kanthal + MV 해치 2 (HV · 2,800K)', 'HV', 480, true, 'EBF-K', [['Aluminium 1700K (VA[MV])', H.al, 918], ['Lumium 1700K (VA[HV])', H.lum, 1000]]],
    ['EN', 'EBF · Kanthal + HV 해치 2 (EV · 2,900K)', 'EV', 1920, true, 'EBF-N', [['Nichrome 2700K (VA[EV])', H.nic, 1300]]],
    ['VF', 'Vacuum Freezer · MV 해치 2', 'HV', 480, true, 'VF', [['Hot Nichrome', H.nic, 170]]],
    ['MX', 'Mixer (MV) · Nichrome · Lumium dust', 'MV', 120, false, 'Mix', [['Nichrome (EMI 시간)', H.nic / 5, 300], ['Lumium (EMI 시간)', H.lum / 6, 300]]],
    ['VC', 'Chemical Reactor · Vinyl Chloride', 'LV', 30, false, 'VCl', [['vinyl_chloride_from_chlorine', vc / 1000, 160]]],
    ['PV', 'LCR · PVC (MV 해치 2)', 'LV', 30, true, 'LCR-P', [['polyvinyl_chloride_from_oxygen', pvc / 216, 160]]],
    ['SR', 'Chemical Reactor · Silicone Rubber', 'LV', 30, false, 'SiR', [['silicone_rubber (PDMS는 LCR-P가 번갈아)', sir / 1296, 600]]],
  ];
  return rows.map(([id, m, t, eut, hatch2, label, jobs]) => { const u = jobs.reduce((a, [, r, d]) => a + r * d, 0) / 72000; return { id, m, t, eut, hatch2, label, jobs, u, n: Math.max(1, Math.ceil(u / 0.95 - 1e-9)) }; });
}

/* ---------- 패시브 화학 청크 (LCR 기준) ----------

function passiveFlows(n = S.veN, pe = S.peN, o = {}) {
  const lcr = o.lcr ?? true, decomp = o.decomp ?? true, f = { lcr };

  f.saPs = f.P * 2;                                           // 황산 2000 → Persulfate 1000
  f.eth = pe * 1000 / 1200;                                   // Ethylene CR pe대 (1200t / 1000)
  f.saEth = f.eth / 3;                                        // 묽은 황산 3000 → 2000 회수, 순 손실 1/3
  f.sa = f.saPs + f.saEth;
  f.pe = f.eth * 1.5;                                         // polyethylene_from_oxygen: 144 → 216
  f.dust = 0.7 * 1.5 * n / CYC;                               // Lepidolite · Pyrochlore dust 각각 (Ore Factory A 기대 1.5)
  f.F = F_PER_CYCLE * n / CYC;
  f.c2f4 = f.F / 4;
  f.ptfe = f.c2f4 * 1.5;
  f.hcl = f.c2f4 * 12 + f.saPs;                               // PTFE 루프 12000/C2F4 + Bisulfate 1000/황산

  f.oUse = f.oSa + f.oPe + f.oPtfe;
  f.oNeed = Math.max(0, f.oUse - f.oByp);
  f.oSpare = Math.max(0, f.oByp - f.oUse);

  f.sulfur = f.sa / 1000;                                     // dust / t
  f.salt = f.saPs / 1000 * 2;                                 // dust / t
  f.hSurplus = f.hcl + f.P * 2 - f.F;                         // HCl 전해 H + ⑤ 전해 H − HF에 쓰는 H

}

  unit(14, 0, 4, { col: '--s4', label: 'Persulf.', tip: 'Super Tank · Sodium Persulfate|→ ME → Ore Factory B' }); node(14, 1, 4, false, 'Persulfate', ['⑤ OUT → 여기']);
  unit(14, 0, 7, { col: '--s4', label: 'PE', tip: 'Super Tank · Polyethylene|→ ME (Fluid Solidifier로 plate · ingot)' }); node(14, 1, 7, false, 'PE', ['P2 OUT → 여기']);
  unit(14, 0, 10, { col: '--s4', label: 'PTFE', tip: 'Super Tank · PTFE|→ ME' }); node(14, 1, 10, false, 'PTFE', ['F6 OUT → 여기']);
  unit(12, 0, 13, { col: '--s4', label: 'dust', tip: 'Lepidolite · Pyrochlore dust 입구|처리 청크 → Ore Factory A에서' });
  unit(0, 2, 7, { col: '--s4', label: '입구', tip: 'Laser Connector · Ethanol|Casket · Large Farm 쪽에서' }); cable('in', [[-5, 2, 7], [0, 2, 7]]);
  // 전력: 컨버터(피크 ÷ 16A) + hv_transformer_16a(승압: LCR · C2F4 HV CR)
  const cNow = passiveTotals(fNow).conv, cMax = passiveTotals(fMax).conv;
  [[14, 12], [14, 13], [14, 14], [14, 15], [13, 13], [13, 12]].slice(0, cMax).forEach(([x, z], i) => unit(x, 0, z, { col: '--s1', ghost: i >= cNow, label: `C${i + 1}`, tip: `mv_16a_energy_converter · C${i + 1}|MV 16A${i >= cNow ? ' · VE 4대 · PE 2대일 때' : ''}` }));
  unit(15, 0, 15, { col: '--s2', label: 'HV', tip: 'hv_transformer_16a (승압)|MV → HV. C2F4 HV CR (LCR은 MV 해치 2개면 MV 간선으로 충분)' });
  node(14, 1, 14, false, '전력 네트워크', ['컨버터 에너지 IN']);
  // MV 간선: x = 12, 각 줄 남쪽 면 / HV: 동쪽 끝 x = 15를 따라 북쪽 LCR 줄(z = 3)과 F5로
  cable('mv', [[13, 0, 13], [12, 0, 13], [12, 0, 5]]);
  [5, 8, 11, 14].forEach(z => { cable('mv', [[12, 0, z], [3, 0, z]]); cable('mv', [[3, 0, z], [3, 2, z]]); });
  // LCR 줄: MV 해치 2개 모드면 MV 간선에서, HV 해치 2개 모드면 트랜스포머에서
  if (S.lcrEv) cable('hv', [[15, 0, 15], [15, 0, 3], [3, 0, 3]]);
  else cable('mv', [[12, 0, 5], [12, 0, 3], [3, 0, 3]]);
  const f5 = boxes.find(q => q.label && q.label.startsWith('F5'));
  cable('hv', [[15, 0, 11], [f5 ? f5.x : 5, 0, 11]]);
  // 레이저 (같은 네트워크 노드끼리 최소 신장 트리)
  const lz = boxes.filter(q => q.node && !q.ghost && !/전력/.test(q.tip));
  const cen = q => [q.x + q.w / 2, q.y + q.h / 2, q.z + q.d / 2];
  const inT = new Set([0]);
  while (lz.length && inT.size < lz.length) {
    let best = null;
    inT.forEach(i => lz.forEach((q, j) => { if (inT.has(j)) return; const d = Math.hypot(...cen(lz[i]).map((v, k) => v - cen(q)[k])); if (!best || d < best.d) best = { i, j, d }; }));
    inT.add(best.j);
    pipes.push({ type: 'beam', pts: [cen(lz[best.i]), cen(lz[best.j])], long: best.d > 8 });
  }
  return { boxes, pipes };
}

    <div><canvas id="lay3d" role="img" aria-label="패시브 화학 청크 3D 배치도" style="display:block;width:100%;border-radius:8px;touch-action:none;cursor:grab"></canvas></div>
    <div class="legend">${Object.values(LINE).map(l => `<span><i style="background:${l.c}"></i>${l.n}</span>`).join('')}${[['--s2', 'HV 기계 · 트랜스포머'], ['--muted', 'Super Tank'], ['--s8', 'LaserIO Node'], ['--s7', 'AE2 · ME']].map(([c, n]) => `<span><i style="background:var(${c})"></i>${n}</span>`).join('')}</div>
    <p class="sub" style="margin:10px 0 0">줄 순서(북 → 남): 황산 LCR · Persulfate(④ ⑤)와 예비 공기 분리 · Polyethylene · PTFE 반응 · Fluorine 분해. 출력 탱크는 동쪽 끝, 전력은 남동쪽 모서리에서 HV는 동쪽 끝을 따라 LCR 줄로.</p>
  </div>
  <div class="grid2">
    <div class="card">
      <h3>배치 원칙</h3>
      <ul class="pts">
        <li><b>LCR은 북쪽 한 줄.</b> 3×3 멀티블럭이라 남쪽 면 가운데에 노드 하나로 Sulfur · Water를 넣고 황산을 뺍니다. 늘릴 때는 동쪽 다음 3칸.</li>
        <li><b>공용 탱크를 서쪽 한 줄에.</b> 산소는 PE와 PTFE가 쓰고, HCl · Cl2 · H2는 PTFE 루프와 Persulfate가 주고받습니다.</li>
        <li><b>같은 CR에 H2와 Cl2를 같이 넣지 않기.</b> HF(F3)와 Chloroform(F4)은 다른 기계 · 다른 채널입니다.</li>
        <li><b>LCR은 MV 해치 2개</b>로 HV 전압이 되므로 MV 케이블(2A × 2)로 충분합니다. HV 트랜스포머는 C2F4 HV CR용입니다. HV 해치 2개 모드로 바꿀 때만 LCR 줄에 HV를 끌어옵니다.</li>
      </ul>
    </div>
    <div class="card">
      <h3>처리 청크와의 연결</h3>
      <ul class="pts">
        <li><b>Persulfate → Ore Factory B</b>, <b>Lepidolite · Pyrochlore dust ← Ore Factory A</b>: 둘 다 ME로 주고받습니다.</li>
        <li><b>Chlorine</b> 남는 양은 5 탭 Titanium의 TiCl4(Titanium 1개당 4000)로.</li>
        <li><b>Hydrogen</b> 남는 양은 F8(Methane)이나 탱크에. Titanium 이후에는 LCR <code>methane_shortcut</code>으로.</li>
      </ul>
    </div>
  </div>`;
}

/* ---------- page wiring ---------- */
startPage({
  key: 'hv-web',
  save: () => ({ veN: S.veN, peN: S.peN, lcrEv: S.lcrEv }),
  load: o => {
    if ([2, 3, 4].includes(o.veN)) S.veN = o.veN;
    if ([1, 2].includes(o.peN)) S.peN = o.peN;
    if (typeof o.lcrEv === 'boolean') S.lcrEv = o.lcrEv;
  },
  alias: { void: 'resource/void', crushed: 'resource/crushed', persulfate: 'resource/persulfate', layout: 'resource/chunk', c2f4: 'ptfe/lcr' },
  layouts: [[viewChunk, () => buildChunk(S.veN)], [viewPassive3d, buildChem], [viewEvp3d, () => pwWire(buildEvpChunk(), PWM_EVP(), 3, 'Conv')]],
  layoutButton: b => {
    if (b.dataset.n) { S.veN = +b.dataset.n; render(); return true; }
    if (b.dataset.pe) { S.peN = +b.dataset.pe; render(); return true; }
    if (b.dataset.ev) { S.lcrEv = b.dataset.ev === '1'; render(); return true; }
    return false;
  },
  mainClick: e => {
    const t = e.target.closest('#lcrctl button'); if (!t) return false;
    if (t.dataset.pe) S.peN = +t.dataset.pe;
    if (t.dataset.ev) S.lcrEv = t.dataset.ev === '1';
    render(); return true;
  },
});
</script>
