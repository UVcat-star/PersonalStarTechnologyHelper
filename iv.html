function buildLuvPrep() {

  unit(13, 0, 1, { col: '--s7', label: 'Mix-IV', tip: 'IV Mixer (단일 블록 · IV 게이트 1)|RPP · NbTi · HSS-S · HSS-E · Ruridit dust' });

  [[2, 3, 'EBF-R 패턴 3종'], [6, 3, 'EBF-H 패턴 3종']].forEach(([x, z, w]) => { lk.me([[x, 0, 4], [x, 0, 4]]); lk.part(x, 0, z, 's', 'pp', `${w} (Blocking) — LuV에서 ME Pattern Buffer로 교체`); });

  lk.node(2, 4, 2, 'EBF-R 출력', ['Hot ingot → VF']); lk.node(6, 4, 2, 'EBF-H 출력', ['Hot ingot → VF']); lk.node(10, 3, 2, 'VF 입력', ['↓ Hot ingot']);
  lk.laser([2, 4, 2], [10, 3, 2]); lk.laser([6, 4, 2], [10, 3, 2]);
  lk.blk(15, 0, 4, 'req', 'RPP 128 · NbTi 256 · HSS-S 64 · HSS-E 64 · Ruridit 32 · Twinite 64 · PPS 16B', 'Req');
