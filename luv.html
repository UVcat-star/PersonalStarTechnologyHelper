  const tries = n * SHARD_PER_STAR;                  // 시간당 Autoclave 시도

    tries, surplus: n * SURPLUS, naq: n * SURPLUS * 20,
    powder: POWDER_PER_TRY * tries / 4,              // 원소마다 가루 개수

    coolant: n * SURPLUS * 8000,
    acHours: tries * 960 / 72000,                    // Autoclave 대-시간

}

  const c = (x, z) => [x + 0.5, 1.2, z + 0.5];
  [[[2, 5], [3, 5]], [[3, 5], [2, 3]], [[11, 3], [5, 5]], [[5, 5], [7, 6]], [[10, 6], [11, 5]], [[11, 5], [2, 5]], [[3, 6], [3, 10]], [[5, 11], [9, 11]], [[12, 5], [11, 1]]]
