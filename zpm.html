/* ---------- state ---------- */
const S = { fzN: 1, topic: 'overview', sub: {}, layGhost: true, layPipes: true, layLabels: true };

  IV: { c: 'var(--s7)', name: 'IV 기계' }, LuV: { c: 'var(--s8)', name: 'LuV 기계 · LuV 레시피' },
  ZPM: { c: 'var(--s4)', name: 'ZPM 기계 · ZPM 레시피' }, GOAL: { c: 'var(--good)', name: '목표' },

/* ---------- constants ----------

   argon_plasma   Carbon 144 + Magnesium 144 → 1000 · 24,576 EU/t · 7.2초 · 시동 180M
   nitrogen_plasma Beryllium 144 + Deuterium 3000 → 1000 · 16,384 EU/t · 7.2초 · 시동 280M
   oxygen_plasma  Carbon 144 + Helium-3 1000 → 1000 · 4,096 EU/t · 12.8초
   tin_plasma     Silver 144 + Helium-3 1500 → 144 · 24,576 EU/t · 7.2초
   팩 plasma_turbines.js: 기체 플라즈마 5mB당 Argon 116t · Nitrogen 110t · Oxygen 98t, Tin 1mB당 84t, 모두 2,048 EU/t. */
const PL = [
  { k: 'argon', n: 'Argon', in: 'Carbon dust 1 + Magnesium dust 1', out: 1000, per: 5, t: 116, eut: 24576, sec: 7.2, start: 180 },
  { k: 'nitrogen', n: 'Nitrogen', in: 'Beryllium dust 1 + Deuterium 3000', out: 1000, per: 5, t: 110, eut: 16384, sec: 7.2, start: 280 },
  { k: 'oxygen', n: 'Oxygen', in: 'Carbon dust 1 + Helium-3 1000', out: 1000, per: 5, t: 98, eut: 4096, sec: 12.8, start: 180 },
  { k: 'tin', n: 'Tin', in: 'Silver dust 1 + Helium-3 1500', out: 144, per: 1, t: 84, eut: 24576, sec: 7.2, start: 280 },
];
PL.forEach(p => { p.gross = p.out / p.per * p.t * 2048 / (p.sec * 20); p.net = p.gross - p.eut; p.runsH = 3600 / p.sec; });
const WET = [
  { n: 'Wetware Processor (팩)', t: 'LuV', id: 'wetware_processor', eut: 38400, dur: 100, out: 2, in: 'Neuro Processing Unit · Crystal CPU · Nano CPU · Living SMD Capacitor 4 · Transistor 4 · YBCO fine 8' },

  { n: 'Wetware Computer (팩)', t: 'UV', id: 'wetware_processor_computer', eut: 64000, dur: 600, out: 1, in: 'Assembly Line: Wetware Board · Assembly 2 · Living Diode 4 · QRAM 12 · NOR 24 · NAND 48 · YBCO fine 32 · Europium plate 2 · ITLC Solder 864 · PBI 576 (연구 64 CWU)' },
  { n: 'Crystal Mainframe (팩)', t: 'UV', id: 'crystal_processor_mainframe', eut: 61440, dur: 1000, out: 1, in: 'Assembly Line: HSS-E Frame 2 · Crystal Computer 2 · RAM 32 · HPIC 4 · ASMD Inductor 12 · Capacitor 24 · Diode 12 · Transistor 16 · NbTi wire 12 · YBCO plate 4 · Solder 1152 (연구 16 CWU)' },
];

/* ---------- topics ---------- */
const TOPICS = [
  { id: 'overview', name: '로드맵' },
  { id: 'entry', name: '1 · ZPM 진입 · 연구' },

  </div>

      <li><b>기계</b>: 팩 <code>zpm_fusion_reactor</code>, <code>research_station</code> · <code>high_performance_computing_array</code> · <code>network_switch</code>(100,000), UV 부품 8종(100,000), <code>coil_trinium</code> · <code>fusion_coil</code>, 팩 <code>heat_chamber</code> · <code>mega_vacuum_freezer</code> · <code>component_part_assembly</code>.</li>
      <li><b>Stargate</b>: 팩 <code>stargate_component_assembly</code> · <code>runic_wave_generator</code> · <code>dimensional_finder</code> · CSG 부품(퀘스트 Making the Classic Stargate) → Abydos.</li>
      <li><b>Fusion</b>: Americium · Pu-239 · Pu-241 · Naquadria · Tin 플라즈마, 팩 반사판 티어 2 레시피(Argon · Nitrogen · Oxygen · Duranium · Darmstadtium).</li>

      <li>UV 회로 → <b>Fusion MK2</b> → <b>Argon 플라즈마</b>로 발전을 바꾸면 UV까지의 전력 문제가 풀립니다.</li>
      <li>Stargate는 UV · Abydos 단계로 넘어가는 문입니다(5 탭).</li>
    </ul></div>
  </div>`;

const PIPE = { beam: { c: '--s8', n: '주요 흐름 (LaserIO)', w: 0.05 } };
function buildArgonChunk() {
  const boxes = [], pipes = [];
  const box = o => (boxes.push(o), o);
  const unit = (x, y, z, o) => box({ x, y, z, w: 1, h: 1, d: 1, ...o });
  const multi = (x, z, w, d, h, col, label, tip) => box({ x, y: 0, z, w, h, d, col, label, tip });
  box({ x: 0, y: -0.02, z: 0, w: 16, h: 0.02, d: 16, ghost: true, outline: true, tip: '청크 경계 16 × 16' });
  box({ x: -9, y: 0, z: 2, w: 8, h: 3, d: 12, ghost: true, col: '--s4', label: 'Fusion MK2 (옆 청크)', tip: 'ZPM Fusion Reactor|크기 EMI 확인 — 옆 청크에 배치' });
  unit(1, 0, 1, { col: '--s1', label: 'C-Ext', tip: 'Extractor · Carbon|dust → 144mB' });
  unit(2, 0, 1, { col: '--s1', label: 'Mg-Ext', tip: 'Extractor · Magnesium|dust → 144mB' });
  unit(1, 0, 3, { col: '--muted', label: 'Carbon', tip: 'Super Tank · Carbon 액체|Fusion 입력' });
  unit(2, 0, 3, { col: '--muted', label: 'Mg', tip: 'Super Tank · Magnesium 액체|Fusion 입력' });
  unit(1, 0, 6, { col: '--s4', label: 'Ar-P', tip: 'Super Tank · Argon 플라즈마|Fusion 출력 → 터빈' });
  unit(1, 0, 7, { col: '--s4', label: 'Ar-P', tip: 'Super Tank · Argon 플라즈마|버퍼' });
  [0, 1, 2, 3].forEach(i => multi(4 + i * 3, 5, 3, 4, 3, '--s8', `Turbine ${i + 1}`, 'Plasma Large Turbine · 3×3×4|Rotor Holder · 로터 티어 EMI 확인'));
  multi(10, 11, 5, 4, 2, '--good', 'Substation', 'Power Substation|시동 180M 저장 · 기지 송전');
  unit(4, 0, 11, { col: '--muted', label: 'Ar gas', tip: 'Argon 회수|터빈 부산물 (EMI 확인)' });
  const c = (x, z) => [x + 0.5, 3.4, z + 0.5];
  [[[1, 1], [1, 3]], [[2, 1], [2, 3]], [[1, 3], [-1, 5]], [[-1, 7], [1, 6]], [[1, 6], [14, 6]], [[14, 9], [12, 11]]]
    .forEach(([a, b]) => pipes.push({ type: 'beam', pts: [c(...a), c(...b)] }));
  return { boxes, pipes };
}
