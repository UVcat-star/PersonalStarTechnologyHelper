function buildUvPrep() {
  const built = { boxes: [], pipes: [] };
  const box = o => (built.boxes.push(o), o);
  const unit = (x, y, z, o) => box({ x, y, z, w: 1, h: 1, d: 1, ...o });
  const multi = (x, z, w, d, h, col, label, tip) => box({ x, y: 0, z, w, h, d, col, label, tip });
  const lk = logiKit(built);
  box({ x: 0, y: -0.02, z: 0, w: 16, h: 0.02, d: 16, ghost: true, outline: true, tip: '청크 경계 16 × 16' });
  lk.blk(0, 0, 8, 'p2p', '기지 ME 컨트롤러에서', 'P2P'); lk.me([[0, 0, 5], [0, 0, 7]]); lk.me([[1, 0, 5], [15, 0, 5]]);
  multi(1, 1, 3, 3, 4, '--s7', 'EBF-R', 'EBF · RTM 코일 + EV 해치 2 (IV · 4,800K)|YBCO · MBCCu · Tungsten Carbide');
  multi(5, 1, 3, 3, 4, '--s4', 'EBF-T', 'EBF · Trinium 코일 + LuV 해치 2 (ZPM · 9,501K)|Prismalium 1800t');
  multi(9, 1, 3, 3, 3, '--s8', 'VF', 'Vacuum Freezer · IV 해치 2|Hot ingot 전부');
  unit(13, 0, 1, { col: '--s7', label: 'Mix', tip: 'IV Mixer|YBCO · MBCCu · WC · Prismalium dust' });
  lk.part(2, 0, 3, 's', 'pbuf', 'EBF-R 패턴 3종 (Pattern Buffer)'); lk.part(6, 0, 3, 's', 'proxy', 'EBF-T — Prismalium 패턴 (Proxy로 같은 버퍼)'); lk.me([[2, 0, 4], [2, 0, 4]]); lk.me([[6, 0, 4], [6, 0, 4]]);
  lk.part(10, 0, 3, 's', 'meout', 'VF 출력'); lk.me([[10, 0, 4], [10, 0, 4]]); lk.part(13, 0, 1, 's', 'pp', 'Mixer 패턴'); lk.me([[13, 0, 2], [13, 0, 4]]);
  lk.node(2, 4, 2, 'EBF-R', ['Hot → VF']); lk.node(6, 4, 2, 'EBF-T', ['Hot → VF']); lk.node(10, 3, 2, 'VF', ['↓ Hot']); lk.laser([2, 4, 2], [10, 3, 2]); lk.laser([6, 4, 2], [10, 3, 2]);
  lk.blk(15, 0, 4, 'req', 'YBCO 256 · Prismalium 128 유지', 'Req');
  unit(14, 0, 7, { col: '--s4', label: 'ZPM Tr', tip: 'luv_transformer|EBF-T 간선' }); unit(15, 0, 7, { col: '--s1', label: 'Conv', tip: '컨버터' });
  return built;
}
