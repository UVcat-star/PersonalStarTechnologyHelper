function buildZrChunk() {

  unit(1, 0, 1, { col: '--muted', label: 'Titanite', tip: 'Titanite dust 창고|Abydos' });
  unit(2, 0, 2, { col: '--s8', label: 'Mixer', tip: 'LuV Mixer · titanite_proc_1|Titanite 8 + Perchloric 3000 · 28,000 EU/t' });
  unit(3, 0, 2, { col: '--s8', label: 'Cent-1', tip: 'LuV Centrifuge · titanite_proc_2|Slurry → CaClO4 11 · Residue · Silica Gel' });
  unit(1, 0, 4, { col: '--muted', label: 'HClO4', tip: 'Super Tank · Perchloric Acid|닫힌 고리 3000mB/회' });
  unit(2, 0, 5, { col: '--s1', label: 'CR-Ca', tip: 'MV Chemical Reactor|CaClO4 11 + H2SO4 1000 → Perchloric 2000 · 496 EU/t' });
  unit(3, 0, 5, { col: '--s1', label: 'Cent-Si', tip: 'EV Centrifuge|Silica Gel → Perchloric 1000 + SiO2 3 · 1,984 EU/t' });
  multi(6, 1, 3, 3, 3, '--s8', 'LCR NaOH', 'LCR · titanite_proc_3|NaOH 6 · 17,500 EU/t (LuV 해치 또는 IV 해치 2)');
  multi(8, 1, 3, 3, 3, '--s8', 'LCR C+HCl', 'LCR · titanite_proc_5|Carbon 2 + HCl 8000 → TiCl4·ZrCl4 + Methanol 2000 · 6,400');
  multi(10, 1, 3, 3, 3, '--s1', 'LCR H2', 'LCR · zirconium_from_zirconium_tetrachloride|ZrCl4 5 + H2 4000 → Zr 1 + HCl 4000 · 1,640');
  unit(14, 0, 2, { col: '--s4', label: 'Elec', tip: 'ZPM Electrolyzer · titanite_proc_4|50,000 EU/t · 800t' });
  unit(14, 0, 5, { col: '--s8', label: 'Cent-Zr', tip: 'LuV Centrifuge · titanite_proc_6|Mixture → ZrCl4 5 + TiCl4 1000 · 1200t (병목)' });
  unit(13, 0, 5, { col: '--s8', label: 'Cent-Zr2', tip: 'LuV Centrifuge 2대째|60개/시간이면 필요' });
  ['H2SO4', 'HCl', 'H2', 'NaOH', 'Carbon', 'MeOH'].forEach((t, i) => unit(6 + i, 0, 8, { col: '--muted', label: t, tip: `Super Tank · ${t}|${t === 'MeOH' ? '부산물 Methanol' : 'HV 화학 청크에서 ME'}` }));
  unit(13, 0, 9, { col: '--good', label: 'Zr', tip: 'Zirconium 창고|→ Complex 반사판 · Abydos 합금' });
  unit(14, 0, 9, { col: '--good', label: 'TiCl4', tip: 'TiCl4 탱크|→ Titanium → Tritanium' });
  unit(14, 0, 14, { col: '--s4', label: 'ZPM Tr', tip: '트랜스포머|ZPM Electrolyzer · LuV 기계 전력' });
  const c = (x, zz) => [x + 0.5, 1.2, zz + 0.5];
  [[[1, 1], [2, 2]], [[2, 2], [3, 2]], [[3, 2], [3, 5]], [[2, 5], [1, 4]], [[1, 4], [2, 2]], [[3, 2], [7, 3]], [[7, 3], [14, 2]], [[14, 2], [9, 3]], [[9, 3], [14, 5]], [[14, 5], [11, 3]], [[11, 3], [13, 9]], [[14, 5], [14, 9]]]
    .forEach(([a, b]) => pipes.push({ type: 'beam', pts: [c(...a), c(...b)] }));
  return { boxes, pipes };
}
