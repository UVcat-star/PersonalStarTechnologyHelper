/* ---------- constants ----------
   Void Extractor (HV 페이지): MV 해치 · 사이클 320t · 사이클당 Molten Ore Mixture 175mB (D 단계).
   Distillation Tower molten_ore_mixture: 10,000mB · 1200t · 1920 EU/t →
   Bauxite 1500 · Pitchblende 1250 · Molybdenite 1000 · Ilmenite 1000 · Bastnasite 1000 · Tungstate 2000 · Cooperite 2250 (+ Metal Mixture dust 1).
   Autoclave raw_*: Molten X Ore 500 + Stone Dust → Raw X (160t · 480 EU/t). */
const CYC = 320, CPH1 = 72000 / CYC, MOM_CYCLE = 175;
const LIMIT = 0.95;
const MOLTEN = [
  { k: 'ilm', n: 'Ilmenite', mb: 1000, use: 'Rutile → Titanium', feed: true },
  { k: 'bau', n: 'Bauxite', mb: 1500, use: 'Aluminium · Rutile · Gallium', feed: true },
  { k: 'tun', n: 'Tungstate', mb: 2000, use: 'Tungsten (IV 준비)', feed: true },
  { k: 'coo', n: 'Cooperite', mb: 2250, use: 'Platinum · Palladium', feed: true },
  { k: 'pit', n: 'Pitchblende', mb: 1250, use: 'Uranium · Thorium (보관)' },
  { k: 'mol', n: 'Molybdenite', mb: 1000, use: 'Molybdenum (MoSi2 코일 · 보관)' },
  { k: 'bas', n: 'Bastnasite', mb: 1000, use: 'Neodymium (EV 모터 자석)' },
];
const momH = n => MOM_CYCLE * CPH1 * n;                   // mB / 시간
const runsH = n => momH(n) / 10000;                         // 증류 / 시간
const rawPerRun = m => m.mb / 500;
// 광석 가공 가정: Raw 1 → Crushed 1, Ore Factory(EV 티어) 본 광물 기대 1.5 dust, 4차 부산물 7.5%
const DUSTPER = 1.5, QUAT = 0.075;
const TI_RUN = (1000 / 500) * DUSTPER * 2 / 10 + (1000 / 500) * QUAT + (1500 / 500) * DUSTPER / 15 + (1500 / 500) * QUAT;   // Rutile = Titanium
const AL_RUN = (1500 / 500) * DUSTPER / 15 * 6;
const W_RUN = (2000 / 500) * DUSTPER / 7;                  // Tungstate 7 → Tungstic Acid 7 → Tungsten 1
const PGS_COO = (2250 / 500) * 4;                          // purified Cooperite 1 → PGS 4 (세척 필요)
const PT_RUN = PGS_COO / 6 * 3 / 3;                        // PGS 6 → Platinum Raw 3 → Platinum 1 (Raw 3당)
const pNeed = u => Math.max(1, Math.ceil(u / LIMIT - 1e-9));

function buildEvChunk() {

  const node = (x, y, z, what) => box({ x: x + 0.15, y: y + 0.15, z: z + 0.15, w: 0.7, h: 0.7, d: 0.7, col: '--s8', node: true, tip: `LaserIO Node · ${what}|` });
  const multi = (x, z, w, d, h, col, label, tip) => box({ x, y: 0, z, w, h, d, col, label, tip });
  const n = S.veN;
  box({ x: 0, y: -0.02, z: 0, w: 16, h: 0.02, d: 16, ghost: true, outline: true, tip: '청크 경계 16 × 16' });
  multi(1, 1, 3, 3, 8, '--s5', 'Distillation', 'Distillation Tower · 3×3 · 8층|HV 해치 2개(EV) · 출력 7종 = 층마다 출력 해치');
  MOLTEN.forEach((m, i) => { unit(5 + i, 0, 1, { col: m.feed ? '--s5' : '--muted', label: m.n.slice(0, 4), tip: `Super Tank · Molten ${m.n}|${m.use}` }); node(5 + i, 1, 1, m.n); });
  MOLTEN.filter(m => m.feed).forEach((m, i) => unit(5 + i, 0, 3, { col: '--s2', label: 'AC-' + m.n.slice(0, 3), tip: `HV Autoclave · ${m.n}|Molten ${m.n} 500 + Stone Dust → Raw` }));
  unit(9, 0, 3, { col: '--s2', label: 'Mac', tip: 'HV Macerator|Raw → Crushed' });
  unit(10, 0, 3, { col: '--s1', label: 'Wash', tip: 'Ore Washer|Cooperite 세척 (EMI 확인)' });
  multi(11, 3, 5, 5, 7, '--s4', 'Ore Factory EV', 'Electric Ore Factory · 5×5 · 높이 7|EV 티어 레시피 · HV 해치 2개 · Persulfate 100');
  multi(1, 6, 3, 3, 4, '--s8', 'EBF Rutile', 'EBF · Ilmenite → Rutile|rutile_from_ilmenite_fix · 1700K');

  multi(5, 10, 3, 3, 3, '--s1', 'Vac Freezer', 'Vacuum Freezer · 3×3×3|Hot Titanium · Tungsten');
  unit(5, 0, 7, { col: '--s2', label: 'TiCl4', tip: 'HV CR · titanium_tetrachloride|Rutile + Carbon 2 + Cl 4000' });
  unit(6, 0, 7, { col: '--s1', label: 'Baux', tip: 'Electrolyzer · Bauxite|15 → Al 6 + Rutile' });
  unit(7, 0, 7, { col: '--s1', label: 'MgCl2', tip: 'Electrolyzer · MgCl2|Mg · Cl 회수 (EMI 확인)' });
  unit(9, 0, 10, { col: '--s5', label: 'W-Bath', tip: 'EV Chemical Bath|tungstic_acid_from_tungstate · 960' });
  unit(10, 0, 10, { col: '--s5', label: 'W-Elec', tip: 'EV Electrolyzer|tungstic_acid_electrolysis · 960' });
  unit(9, 0, 13, { col: '--s1', label: 'AquaR', tip: 'Mixer · Aqua Regia|Nitric 1000 + HCl 2000' });
  unit(10, 0, 13, { col: '--s1', label: 'PGS', tip: 'CR · pgs_from_cooperite|Purified + Nitric 100' });
  unit(11, 0, 13, { col: '--s2', label: 'PGS-C', tip: 'HV Centrifuge · pgs_separation|PGS 6 + Aqua Regia 1200' });
